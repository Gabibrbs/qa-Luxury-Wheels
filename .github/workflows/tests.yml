name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # This repository (the tests)
      - uses: actions/checkout@v4
        with:
          path: qa-luxury-wheels
      # The project under test, in a folder next to it (where conftest.py looks for it)
      - uses: actions/checkout@v4
        with:
          repository: Gabibrbs/luxury-wheels
          path: luxury-wheels
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r qa-luxury-wheels/requirements.txt
      # Downloads the browser used by the Playwright tests (headless on GitHub)
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest --html=report.html --self-contained-html
        working-directory: qa-luxury-wheels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: qa-luxury-wheels/report.html
